name: Deploy Node Studio to GitHub Pages

on:
  push:
    branches: [ 'akhilreddy-dev1-web-ui-frontend' ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        run: |
          cd web
          npm install

      - name: Build frontend
        run: |
          cd web
          npm run build

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-artifact@v4
        with:
          name: pages
          path: web/dist

  deploy-pages:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
